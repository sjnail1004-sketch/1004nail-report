function topScroll() {

    if (w.previousElementSibling && w.previousElementSibling.classList.contains("tblwrap-top")) return;
    var tbl = w.querySelector("table"); if (!tbl) return;
    var top = document.createElement("div"); top.className = "tblwrap-top";
    var inner = document.createElement("div"); top.appendChild(inner);
    w.parentNode.insertBefore(top, w);
    function sync() { inner.style.width = tbl.scrollWidth + "px"; top.style.display = tbl.scrollWidth > w.clientWidth + 1 ? "" : "none"; }
    sync(); if (window.ResizeObserver) new ResizeObserver(sync).observe(w);
    var lock = false;
    top.addEventListener("scroll", function () { if (lock) return; lock = true; w.scrollLeft = top.scrollLeft; lock = false; });
