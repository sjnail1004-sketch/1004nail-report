function bytes(b64){ var s = atob(b64), a = new Uint8Array(s.length);
  for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
async function open_(pw){
  var raw = bytes(DATA), salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
  var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:ITER, hash:"SHA-256"},

  var plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, ct);
  return new TextDecoder().decode(plain);
}

async function tryPw(pw, remember){

  show(html);
}
