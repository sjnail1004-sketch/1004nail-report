  var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:ITER, hash:"SHA-256"},
                                          km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  var plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, ct);
  return new TextDecoder().decode(plain);
}
function show(html){
  document.open(); document.write(html); document.close();
}
async function tryPw(pw, remember){
  var html = await open_(pw);
  if (remember) { try { localStorage.setItem(KEY, pw); } catch (e) {} }
  show(html);
}
if (!(window.crypto && window.crypto.subtle)) {
  document.getElementById("err").textContent = "이 주소에서는 열 수 없습니다 (https 주소로 접속해 주세요)";

              document.getElementById("pw").select(); }
});
(async function (){
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (!saved) return;
  try { await tryPw(saved, false); }
  catch (x) { try { localStorage.removeItem(KEY); } catch (e) {} }
})();
