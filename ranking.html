      ${STALE.length ? `<div class="warn">⚠ ${STALE.map(x => `${esc(x.label)} 월별 파일이 ${f(x.want - x.have)}개만큼 뒤처져 있습니다 (파일 ${f(x.have)}개 · 일별 합계 ${f(x.want)}개)`).join(" / ")}. WING 판매통계에서 해당 월 파일을 다시 받아 넣으면 누적이 맞아집니다.</div>` : ""}
    </div>`;
}
function render() {
  renderCum();
  const M = D[g];
  const maxq = Math.max(...M.flatMap(m => m.rows.map(r => r.qty)), 1);
  document.getElementById("mnote").textContent = `▲▼는 전월 대비 순위 변동 · 막대 길이 = ${M.length}개월 중 한 달 최고 기록 대비라 달끼리 비교할 수 있습니다 · %는 그 달 전체 대비 비중`;
  document.getElementById("months").innerHTML = M.map((m, mi) => `
    <div class="card">
      <h2>${esc(m.label)}<small>상품 ${m.prods_all}개 중 판매 ${m.prods}개 · 상위 ${Math.min(5, m.rows.length)}개</small></h2>
      ${rankList(m.rows, maxq, `${g}-${mi}`)}
      <div class="foot">상위 5개 합계 ${f(m.top5_qty)}개 · 이 달 전체 ${f(m.total_qty)}개의 ${(m.top5_qty / (m.total_qty || 1) * 100).toFixed(0)}% <span class="unit">낱개 기준</span></div>
      <div class="foot2">쿠팡 판매 수량 ${f(m.sold_qty)} (묶음 상품을 1로 세는 쿠팡 집계, 주문 건수 아님)</div>
    </div>`).join("");
  document.getElementById("note").textContent =
    g === "전체" ? "뷰티와 생활용품을 합친 전체 순위입니다." : g + " 상품만 모아 다시 매긴 순위입니다.";
  document.getElementById("foot").innerHTML =
    `출처: 로켓그로스 월별 판매현황 파일 (${M.map(m => esc(m.label)).join(" · ")}) · `
    + `낱개 개수 = 쿠팡 순 판매 상품 수 × 묶음 수. 쿠팡은 2개 묶음 상품도 1로 세지만 여기서는 2개로 풀어 셉니다. 둘 다 주문 건수와는 다릅니다. · `
    + `▲▼는 전월 대비 순위 변동, 막대 길이는 월 사이 비교용으로 같은 기준입니다. · `
    + `상품명 옆 회색 버튼을 누르면 그달 팔린 색상·옵션을 모두 펼쳐 보여줍니다.`;
}
document.getElementById("foot2").innerHTML = NONAME.length
  ? `※ 옆에 <b>이름 미등록</b>이 붙은 색상은 쿠팡 옵션명에 색상 이름 없이 코드만 등록된 것입니다 (${NONAME.join(", ")}). WING 상품수정에서 옵션명을 채우면 다음 갱신부터 자동으로 표시됩니다.`
  : "";
document.addEventListener("click", e => {
  const b = e.target.closest(".exp");
  if (!b) return;
  const panel = document.getElementById(b.getAttribute("aria-controls"));
  const open = b.getAttribute("aria-expanded") === "true";
  b.setAttribute("aria-expanded", String(!open));
  if (panel) panel.hidden = open;
});
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  g = b.dataset.g;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
render();
</script>
